<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Applications Tracker – Pheeraphat</title>

  <!-- Font Awesome (functional icons only) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        referrerpolicy="no-referrer" />

  <!-- Typography: Fraunces (characterful serif for display) + Manrope (clean geometric body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,560;0,9..144,680;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Local snapshot of data.json. A <script src> tag loads fine on
       file:// (unlike fetch, which browsers block for local files),
       so this guarantees the tracker has data even when opened by
       double-clicking. When served over http:// the loader below
       prefers the live data.json instead. Keep data.js in sync with
       data.json (regenerate it after editing data.json). -->
  <script src="data.js"></script>

  <style>
    :root {
      /* Warm, professional light surface — neutrals tinted toward the accent hue */
      --bg:        oklch(97.3% 0.008  85);
      --surface:   oklch(99.2% 0.003  85);
      --surface-2: oklch(95.5% 0.010  85);
      --surface-3: oklch(92.5% 0.013  85);
      --border:    oklch(88.5% 0.014  75);
      --border-2:  oklch(80% 0.020  75);
      --text:      oklch(24% 0.028  262);
      --muted:     oklch(46% 0.028  262);
      --muted-2:   oklch(60% 0.020  262);

      --accent:    oklch(42% 0.135 262);
      --accent-2:  oklch(34% 0.130 262);
      --accent-soft: oklch(93% 0.035 262);

      --green:     oklch(52% 0.130 155);
      --green-soft: oklch(93% 0.055 155);
      --amber:     oklch(58% 0.140 75);
      --amber-soft: oklch(93% 0.070 75);
      --red:       oklch(54% 0.170 25);
      --red-soft:  oklch(93% 0.050 25);
      --slate:     oklch(50% 0.020 262);
      --slate-soft: oklch(92% 0.010 262);

      --radius:    14px;
      --radius-sm: 9px;
      --shadow-sm: 0 1px 2px oklch(24% 0.03 262 / 0.06);
      --shadow-md: 0 10px 30px -12px oklch(24% 0.03 262 / 0.18);
      --shadow-lg: 0 24px 60px -20px oklch(24% 0.03 262 / 0.28);

      --ease: cubic-bezier(.16,1,.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 10% -10%, oklch(90% 0.03 262 / .35), transparent 45%),
        radial-gradient(circle at 100% 0%, oklch(93% 0.03 75 / .3), transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-size: 14.5px;
      line-height: 1.45;
    }

    .display { font-family: 'Fraunces', Georgia, serif; }

    ::selection { background: oklch(80% 0.06 262 / .5); }

    *::-webkit-scrollbar { height: 10px; width: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

    a { color: inherit; }

    /* ── Shell ──────────────────────────────────────────────── */
    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: clamp(20px, 3.5vw, 44px) clamp(16px, 4vw, 40px) 100px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding-bottom: clamp(20px, 3vw, 32px);
      border-bottom: 1px solid var(--border);
      margin-bottom: clamp(20px, 3vw, 30px);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand .mark {
      width: 46px; height: 46px; flex: none;
      display: grid; place-items: center;
      background: linear-gradient(155deg, var(--accent), var(--accent-2));
      border-radius: 12px;
      color: oklch(97% 0.01 262);
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: .01em;
      box-shadow: var(--shadow-md);
    }
    header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 560;
      font-size: clamp(1.4rem, 2.2vw, 1.7rem);
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    header .sub { font-size: 0.83rem; color: var(--muted); margin-top: 4px; }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .source-chip {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.74rem; color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }
    .source-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
    .source-chip.warn .dot { background: var(--amber); }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 15px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.82rem; font-weight: 700;
      font-family: inherit;
      transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease);
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--accent-2); box-shadow: var(--shadow-md); }
    .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-2); }
    .btn-danger { background: var(--surface); color: var(--red); border-color: var(--red-soft); }
    .btn-danger:hover { background: var(--red-soft); }
    .btn-icon {
      width: 36px; height: 36px; padding: 0;
      justify-content: center;
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .btn-icon:hover { color: var(--text); background: var(--surface-2); }
    .btn-icon.spin i { transition: transform .5s var(--ease); }
    .btn-icon.spin:active i { transform: rotate(180deg); }

    /* ── Stat strip (editorial, not identical cards) ───────── */
    .stat-strip {
      display: flex;
      align-items: stretch;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 22px;
      overflow: hidden;
      flex-wrap: wrap;
    }
    .stat-hero {
      flex: 1 1 240px;
      display: flex; align-items: center; gap: 16px;
      padding: 22px 26px;
      background: linear-gradient(155deg, var(--accent-soft), var(--surface) 75%);
      position: relative;
    }
    .stat-hero .ico {
      width: 46px; height: 46px; flex: none;
      display: grid; place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-hero .num { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.1rem; line-height: 1; color: var(--text); }
    .stat-hero .lbl { font-size: 0.74rem; color: var(--muted); margin-top: 5px; }

    .stat-minis { display: flex; flex: 2 1 420px; flex-wrap: wrap; }
    .stat-mini {
      flex: 1 1 110px;
      display: flex; flex-direction: column; justify-content: center; gap: 3px;
      padding: 18px 22px;
      border-left: 1px solid var(--border);
    }
    .stat-mini .num { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .stat-mini .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-mini.m-interview .num { color: var(--green); }
    .stat-mini.m-offer .num     { color: var(--amber); }

    /* ── Controls ───────────────────────────────────────────── */
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
      margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      padding-left: 2px;
      font-weight: 600;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
    .search-wrap i.fa-magnifying-glass {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--muted-2); font-size: 0.82rem; pointer-events: none;
    }
    .input, .select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 9px 13px;
      font-size: 0.83rem;
      outline: none;
      font-family: inherit;
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
      width: 100%;
    }
    .search-wrap .input { padding-left: 36px; }
    .input:focus, .select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .select { cursor: pointer; min-width: 128px; }

    .spacer { flex: 1; }

    .count-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.78rem; color: var(--muted);
    }
    .count-badge b { color: var(--accent); font-weight: 800; }

    /* ── Table card ─────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    thead th {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.66rem;
      letter-spacing: .06em;
      padding: 13px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky; top: 0;
      transition: color .15s;
    }
    thead th:hover { color: var(--text); }
    thead th .th-icon { margin-left: 6px; opacity: .4; font-size: .68rem; }
    thead th.active .th-icon { opacity: 1; color: var(--accent); }
    thead th.no-sort { cursor: default; }
    thead th.no-sort:hover { color: var(--muted); }

    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s var(--ease); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td { padding: 12px 16px; vertical-align: middle; }

    td.id       { color: var(--muted-2); font-size: 0.74rem; width: 40px; }
    td.date     { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
    td.title    { font-weight: 700; color: var(--text); max-width: 280px; }
    td.company  { color: var(--text); }
    td.location { color: var(--muted); font-size: 0.79rem; }
    td.salary   { white-space: nowrap; color: var(--green); font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    td.notes    { color: var(--muted-2); font-size: 0.78rem; }

    /* ── Status badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 0.71rem; font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .badge-applied   { background: var(--accent-soft); color: var(--accent); }
    .badge-interview { background: var(--green-soft);  color: var(--green); }
    .badge-offered   { background: var(--amber-soft);  color: oklch(46% 0.13 75); }
    .badge-rejected  { background: var(--red-soft);    color: var(--red); }
    .badge-withdrawn { background: var(--slate-soft);  color: var(--slate); }
    .badge-default   { background: var(--surface-2);   color: var(--muted); }

    /* ── Pills ── */
    .pill { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 0.7rem; white-space: nowrap; }
    .pill-level    { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
    .pill-platform { background: var(--accent-soft); border: 1px solid transparent; color: var(--accent); font-weight: 600; }

    /* ── Row actions ── */
    .actions { display: flex; gap: 4px; }
    .icon-btn {
      background: transparent; border: 1px solid transparent; cursor: pointer;
      color: var(--muted-2); width: 30px; height: 30px;
      display: grid; place-items: center;
      border-radius: 7px; transition: all .15s var(--ease);
      font-size: 0.82rem;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-3); border-color: var(--border); }
    .icon-btn.del:hover { color: var(--red); background: var(--red-soft); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 72px 20px; color: var(--muted-2); }
    .empty i { font-size: 2.2rem; margin-bottom: 14px; opacity: .35; color: var(--accent); }
    .empty p { font-size: 0.92rem; color: var(--text); font-weight: 600; }
    .empty .hint { font-size: 0.79rem; color: var(--muted); margin-top: 10px; max-width: 420px; margin-inline: auto; line-height: 1.6; font-weight: 400; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 26px; right: 26px;
      width: 56px; height: 56px;
      background: var(--accent);
      color: #fff; border: none; border-radius: 50%;
      font-size: 1.2rem; cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: transform .18s var(--ease), background .18s var(--ease);
      z-index: 50;
      display: grid; place-items: center;
    }
    .fab:hover { transform: translateY(-3px) scale(1.05); background: var(--accent-2); }
    .fab:active { transform: scale(.96); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: oklch(20% 0.03 262 / .45);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; animation: fade-in .15s var(--ease); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      width: 600px; max-width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modal-in .22s var(--ease);
    }
    @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .modal-head .mh-ico {
      width: 36px; height: 36px; flex: none; display: grid; place-items: center;
      border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    }
    .modal-head h2 { font-family: 'Fraunces', serif; font-weight: 560; font-size: 1.2rem; color: var(--text); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .form-group textarea { resize: vertical; min-height: 64px; font-family: inherit; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ── Mobile card layout for table ─────────────────────── */
    @media (max-width: 760px) {
      .stat-hero { flex-basis: 100%; }
      .stat-mini { flex-basis: 45%; }
      .table-scroll { overflow: visible; }
      thead { display: none; }
      tbody, tr, td { display: block; width: 100%; }
      tbody tr {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin: 10px;
        padding: 4px 4px;
        background: var(--surface);
      }
      td {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 9px 12px;
        border-bottom: 1px dashed var(--border);
        text-align: right;
      }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        font-size: 0.68rem; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); font-weight: 700; text-align: left;
      }
      td.id { display: none; }
      td.title { max-width: none; }
      .actions { justify-content: flex-end; width: 100%; }
    }
    @media (max-width: 520px) {
      .search-wrap { max-width: none; }
      .form-grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
    }

    /* ── Print ──────────────────────────────────────────────── */
    @media print {
      .header-actions, .controls, .fab, .modal-overlay, .stat-strip .ico { display: none !important; }
      body { background: #fff; }
      .shell { max-width: none; padding: 0; }
      .table-card { border: none; box-shadow: none; }
      thead th { position: static; }
      .actions { display: none !important; }
      td:last-child { display: none; }
    }
    /* === 2026 glass dashboard redesign === */
    :root {
      --bg: #080b14;
      --surface: rgba(19, 25, 40, .78);
      --surface-2: rgba(30, 39, 59, .72);
      --surface-3: rgba(47, 59, 84, .62);
      --border: rgba(177, 198, 237, .16);
      --border-2: rgba(185, 205, 255, .30);
      --text: #f5f7ff;
      --muted: #a9b4cb;
      --muted-2: #74809b;
      --accent: #829cff;
      --accent-2: #a6b6ff;
      --accent-soft: rgba(122, 147, 255, .16);
      --green: #6ee7b7;
      --green-soft: rgba(73, 207, 156, .14);
      --amber: #f7c66c;
      --amber-soft: rgba(245, 184, 75, .14);
      --red: #ff8999;
      --red-soft: rgba(255, 112, 132, .14);
      --slate: #b2bfd7;
      --slate-soft: rgba(177, 193, 219, .13);
      --radius: 20px;
      --radius-sm: 12px;
      --shadow-sm: 0 10px 24px rgba(0, 0, 0, .18);
      --shadow-md: 0 20px 50px rgba(0, 0, 0, .28);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, .42);
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 8% 0%, rgba(99, 115, 237, .24), transparent 27rem),
        radial-gradient(circle at 100% 16%, rgba(32, 179, 190, .12), transparent 25rem),
        linear-gradient(135deg, #080b14 0%, #0c1120 52%, #080b14 100%);
      color: var(--text);
      font-size: 14px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }
    .shell {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: clamp(18px, 3.5vw, 52px) clamp(14px, 3vw, 42px) 112px;
      position: relative;
    }

    header {
      align-items: center;
      padding: clamp(18px, 2vw, 26px);
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(120deg, rgba(31, 40, 61, .82), rgba(13, 18, 31, .72));
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(18px);
    }
    .brand { gap: 14px; }
    .brand .mark {
      width: 48px; height: 48px;
      border: 1px solid rgba(207, 218, 255, .42);
      border-radius: 15px;
      background: linear-gradient(145deg, #9badff, #596fd2);
      color: #0b1020;
      box-shadow: 0 10px 28px rgba(91, 113, 210, .32);
    }
    header h1 { font-family: 'Manrope', sans-serif; font-size: clamp(1.35rem, 2.4vw, 1.85rem); font-weight: 800; letter-spacing: -.045em; color: var(--text); }
    header .sub { color: var(--muted); font-size: .8rem; }
    .header-actions { gap: 8px; }
    .source-chip, .count-badge {
      background: rgba(8, 12, 22, .48);
      color: var(--muted);
      border-color: var(--border);
      box-shadow: none;
    }
    .source-chip .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(110, 231, 183, .12); }
    .source-chip.warn .dot { background: var(--amber); box-shadow: 0 0 0 4px rgba(247, 198, 108, .12); }

    .btn {
      min-height: 38px;
      padding: 9px 14px;
      border-radius: 11px;
      border-color: transparent;
      color: var(--text);
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .btn:focus-visible, .icon-btn:focus-visible, .input:focus-visible, .select:focus-visible, .fab:focus-visible { outline: 3px solid rgba(150, 171, 255, .55); outline-offset: 2px; }
    .btn-primary { background: linear-gradient(135deg, #8ca5ff, #667ee7); color: #0a0e1c; box-shadow: 0 8px 22px rgba(102, 126, 231, .27); }
    .btn-primary:hover { background: linear-gradient(135deg, #b1c1ff, #788ff4); color: #050812; box-shadow: 0 12px 30px rgba(102, 126, 231, .38); transform: translateY(-1px); }
    .btn-ghost, .btn-icon { background: rgba(28, 37, 57, .60); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover, .btn-icon:hover { background: rgba(53, 65, 93, .75); border-color: var(--border-2); }
    .btn-danger { background: rgba(105, 31, 47, .28); border-color: rgba(255, 137, 153, .30); color: #ffb7c0; }
    .btn-danger:hover { background: rgba(168, 47, 69, .36); }

    .stat-strip {
      gap: 1px;
      margin-bottom: 18px;
      padding: 1px;
      border-color: var(--border);
      border-radius: var(--radius);
      background: var(--border);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(18px);
    }
    .stat-hero { padding: 24px 26px; background: linear-gradient(135deg, rgba(82, 102, 195, .36), rgba(24, 31, 50, .85)); }
    .stat-hero .ico { background: rgba(143, 163, 255, .18); border: 1px solid rgba(170, 187, 255, .28); color: #b9c6ff; box-shadow: none; }
    .stat-hero .num { font-family: 'Manrope', sans-serif; font-weight: 800; color: var(--text); }
    .stat-hero .lbl, .stat-mini .lbl { color: var(--muted); }
    .stat-minis { gap: 1px; background: var(--border); }
    .stat-mini { background: rgba(18, 24, 39, .84); border: 0; padding: 20px 22px; }
    .stat-mini .num { color: #dce4ff; }
    .stat-mini.m-interview .num { color: var(--green); }
    .stat-mini.m-offer .num { color: var(--amber); }

    .controls {
      padding: 16px;
      gap: 12px;
      margin-bottom: 18px;
      background: rgba(18, 24, 39, .66);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(18px);
    }
    .field { gap: 7px; }
    .field label { color: var(--muted); font-size: .65rem; }
    .search-wrap { flex: 1 1 260px; max-width: none; }
    .input, .select {
      min-height: 40px;
      background: rgba(7, 11, 21, .52);
      border-color: var(--border);
      color: var(--text);
      border-radius: 10px;
    }
    .input::placeholder { color: var(--muted-2); }
    .input:focus, .select:focus { border-color: #97aaff; box-shadow: 0 0 0 3px rgba(130, 156, 255, .16); }
    .select option { background: #141b2c; color: var(--text); }
    .count-badge { min-height: 38px; color: var(--muted); }
    .count-badge b { color: #b3c1ff; }

    .table-card {
      border-color: var(--border);
      border-radius: var(--radius);
      background: rgba(18, 24, 39, .70);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(18px);
    }
    .table-scroll { max-height: min(65vh, 760px); overflow: auto; scrollbar-color: #65769b transparent; }
    table { min-width: 1220px; color: var(--text); }
    thead th {
      z-index: 2;
      background: rgba(29, 38, 58, .96);
      color: #b9c4dc;
      border-bottom-color: var(--border);
      padding: 15px 16px;
      letter-spacing: .075em;
    }
    thead th:hover, thead th.active { color: var(--text); }
    thead th.active .th-icon { color: #aebcff; }
    tbody tr { border-bottom-color: rgba(177, 198, 237, .10); }
    tbody tr:hover { background: rgba(98, 116, 176, .14); }
    td { padding: 14px 16px; }
    td.id { color: var(--muted-2); }
    td.date, td.location, td.notes { color: var(--muted); }
    td.title { min-width: 205px; color: var(--text); }
    td.company { min-width: 150px; }
    td.notes { min-width: 190px; max-width: 290px; line-height: 1.5; }
    td.salary { color: #8ee8c3; }
    .badge { padding: 5px 10px; border-color: rgba(255,255,255,.06); }
    .badge-applied { background: var(--accent-soft); color: #b1c1ff; }
    .badge-interview { background: var(--green-soft); color: var(--green); }
    .badge-offered { background: var(--amber-soft); color: var(--amber); }
    .badge-rejected { background: var(--red-soft); color: var(--red); }
    .badge-withdrawn { background: var(--slate-soft); color: var(--slate); }
    .badge-default { background: var(--surface-3); color: var(--muted); }
    .pill { padding: 4px 8px; border-radius: 7px; }
    .pill-level { background: rgba(56, 69, 96, .32); border-color: rgba(177, 198, 237, .13); color: #ccd5e9; }
    .pill-platform { background: rgba(107, 130, 255, .13); color: #b8c5ff; }
    .actions { gap: 5px; }
    .icon-btn { width: 32px; height: 32px; background: rgba(43, 54, 78, .38); border-color: rgba(177, 198, 237, .10); color: #c0cae0; }
    .icon-btn:hover { background: rgba(104, 123, 185, .34); border-color: var(--border-2); color: #fff; }
    .icon-btn.del:hover { background: var(--red-soft); border-color: rgba(255,137,153,.30); color: var(--red); }
    .empty { color: var(--muted); padding: 82px 20px; }
    .empty i { color: #aebcff; }
    .empty p { color: var(--text); }

    .fab { background: linear-gradient(135deg, #9badff, #667ee7); color: #090d1b; border: 1px solid rgba(206, 216, 255, .44); bottom: 28px; right: 28px; }
    .fab:hover { background: linear-gradient(135deg, #bac7ff, #7d93f6); }
    .modal-overlay { background: rgba(3, 6, 13, .72); backdrop-filter: blur(10px); }
    .modal { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: clamp(20px, 4vw, 32px); background: linear-gradient(145deg, rgba(34, 44, 67, .97), rgba(14, 19, 32, .97)); border-color: var(--border-2); box-shadow: var(--shadow-lg); }
    .modal-head h2 { font-family: 'Manrope', sans-serif; font-weight: 800; color: var(--text); }
    .mh-ico { background: rgba(133, 157, 255, .18); color: #b7c4ff; }
    .form-group label { color: var(--muted); }

    @media (max-width: 900px) {
      .controls .spacer { display: none; }
      .controls > .field:last-child { width: 100%; }
      .controls > .field:last-child > div { justify-content: flex-start; }
      .table-scroll { max-height: 62vh; }
    }
    @media (max-width: 760px) {
      .shell { padding-bottom: 96px; }
      header { align-items: flex-start; gap: 16px; }
      .header-actions { width: 100%; }
      .source-chip { flex: 1 1 100%; justify-content: center; }
      .header-actions .btn:not(.btn-icon) { flex: 1; justify-content: center; }
      .stat-strip { display: grid; grid-template-columns: 1fr 1fr; }
      .stat-hero { grid-column: 1 / -1; }
      .stat-minis { display: contents; }
      .stat-mini { min-height: 92px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      .search-wrap, .controls > .field:last-child { grid-column: 1 / -1; }
      .controls .field > .select { min-width: 0; }
      .table-scroll { overflow: visible; max-height: none; padding: 8px; }
      table { min-width: 0; }
      thead { display: none; }
      tbody, tr, td { display: block; width: 100%; }
      tbody { display: grid; gap: 10px; }
      tbody tr { margin: 0; padding: 6px 12px; border: 1px solid var(--border); border-radius: 14px; background: rgba(30, 39, 59, .56); }
      tbody tr:hover { background: rgba(47, 59, 84, .62); }
      td { display: grid; grid-template-columns: minmax(92px, .72fr) minmax(0, 1.28fr); align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(177, 198, 237, .10); text-align: right; }
      td::before { content: attr(data-label); color: var(--muted); font-size: .64rem; font-weight: 800; letter-spacing: .065em; text-align: left; }
      td.id { display: none; }
      td.title, td.company, td.notes { min-width: 0; max-width: none; }
      td.title { color: #fff; }
      td.notes { overflow-wrap: anywhere; }
      td:last-child { border-bottom: 0; }
      td:last-child::before { content: 'Actions'; }

      .fab { width: 52px; height: 52px; bottom: 20px; right: 18px; }
      .modal-actions { flex-wrap: wrap; }

    }
    @media (max-width: 430px) {
      .shell { padding-inline: 10px; }

      .controls > .field:last-child > div .btn { flex: 1; justify-content: center; }

    @media print {
      body { background: #fff; color: #111; }
      body::before { display: none; }
      header, .stat-strip, .controls, .table-card { background: #fff; border-color: #ddd; box-shadow: none; }
      td, th { color: #111 !important; }
    }
  </style>
</head>
<body>

<div class="shell">

  <header>
    <div class="brand">
      <div class="mark">PB</div>
      <div>
        <h1>Job Applications</h1>
        <p class="sub">Pheeraphat Bunliang &middot; Gillingham, Kent</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="source-chip" id="source-chip">
        <span class="dot"></span>
        <span id="source-text">Loading data.json&hellip;</span>
      </span>
      <button class="btn btn-icon spin" title="Reload data.json" onclick="reloadFromServer()">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="btn btn-ghost" title="Print / save as PDF" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print
      </button>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="fa-solid fa-plus"></i> Add
      </button>
    </div>
  </header>

  <div class="stat-strip">
    <div class="stat-hero">
      <div class="ico"><i class="fa-solid fa-briefcase"></i></div>
      <div><div class="num" id="stat-total">0</div><div class="lbl">Total applications</div></div>
    </div>
    <div class="stat-minis">
      <div class="stat-mini m-week">
        <div class="num" id="stat-this-week">0</div>
        <div class="lbl">This Week</div>
      </div>
      <div class="stat-mini m-month">
        <div class="num" id="stat-this-month">0</div>
        <div class="lbl">This Month</div>
      </div>
      <div class="stat-mini m-interview">
        <div class="num" id="stat-interviews">0</div>
        <div class="lbl">Interviews</div>
      </div>
      <div class="stat-mini m-offer">
        <div class="num" id="stat-offers">0</div>
        <div class="lbl">Offers</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="field search-wrap">
      <label>Search</label>
      <div style="position:relative; width:100%;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" class="input" placeholder="Title, company, location…" oninput="render()" />
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="filter-status" class="select" onchange="render()">
        <option value="">All</option>
        <option>Applied</option>
        <option>Interview</option>
        <option>Offered</option>
        <option>Rejected</option>
        <option>Withdrawn</option>
      </select>
    </div>
    <div class="field">
      <label>Platform</label>
      <select id="filter-platform" class="select" onchange="render()">
        <option value="">All</option>
      </select>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="filter-level" class="select" onchange="render()">
        <option value="">All</option>
      </select>
    </div>
    <div class="spacer"></div>
    <div class="field">
      <label>&nbsp;</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <span class="count-badge">
          <i class="fa-solid fa-list"></i> Showing <b id="showing-count">0</b> of <b id="total-count">0</b>
        </span>
        <button class="btn btn-ghost" onclick="exportCSV()">
          <i class="fa-solid fa-file-csv"></i> CSV
        </button>
        <button class="btn btn-ghost" onclick="exportJSON()">
          <i class="fa-solid fa-file-code"></i> JSON
        </button>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th data-col="id">#</th>
            <th class="active" data-col="date">Date <i class="fa-solid fa-sort-down th-icon"></i></th>
            <th data-col="title">Job Title <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="company">Company <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="location">Location <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="platform">Platform <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="level">Level <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="salary">Salary <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="status">Status <i class="fa-solid fa-sort th-icon"></i></th>
            <th data-col="notes">Notes <i class="fa-solid fa-sort th-icon"></i></th>
            <th class="no-sort">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">
      <i class="fa-regular fa-folder-open"></i>
      <p id="empty-text">No applications match your filters.</p>
    </div>
  </div>

</div>

<!-- FAB -->
<button class="fab" title="Add application" onclick="openModal()">
  <i class="fa-solid fa-plus"></i>
</button>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="mh-ico"><i class="fa-solid fa-pen-to-square"></i></div>
      <h2 id="modal-title">Add Application</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Date Applied</label>
        <input type="date" id="f-date" class="input" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status" class="select">
          <option>Applied</option>
          <option>Interview</option>
          <option>Offered</option>
          <option>Rejected</option>
          <option>Withdrawn</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Job Title</label>
        <input type="text" id="f-title" class="input" placeholder="e.g. IT Support Engineer" />
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="f-company" class="input" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="f-location" class="input" />
      </div>
      <div class="form-group">
        <label>Platform</label>
        <input type="text" id="f-platform" class="input" placeholder="Reed, TotalJobs…" />
      </div>
      <div class="form-group">
        <label>Job Level / Category</label>
        <input type="text" id="f-level" class="input" placeholder="Admin/Entry Level…" />
      </div>
      <div class="form-group full">
        <label>Salary</label>
        <input type="text" id="f-salary" class="input" placeholder="£25,000 or 14/hr" />
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea id="f-notes" class="input" placeholder="Easy Apply, referral, etc."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="btn-delete" onclick="deleteEntry()" style="display:none">
        <i class="fa-solid fa-trash"></i> Delete
      </button>
      <button class="btn btn-primary" onclick="saveEntry()">
        <i class="fa-solid fa-floppy-disk"></i> Save
      </button>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────
  let data = [];
  let editingId = null;
  let sortCol = 'date';
  let sortDir = 'desc';

  const STORAGE_KEY = 'job_tracker_data_v2';

  // ── Data loading ───────────────────────────────────────────
  // data.json is the authoritative source when served over http://.
  // When you open tracker.html directly (file://), the browser
  // blocks fetch() — so we fall back to window.SEED_DATA, which is
  // loaded synchronously from the data.js snapshot via a <script>
  // tag (script tags are NOT blocked on file://).
  async function loadData() {
    const chip = document.getElementById('source-chip');
    const text = document.getElementById('source-text');
    const finish = (rows, source, warn = false) => {
      data = Array.isArray(rows) ? rows : [];
      chip.classList.toggle('warn', warn);
      text.textContent = source + ' · ' + data.length + ' entries';
      buildFilters();
      updateStats();
      render();
    };

    // Try the live data.json first (works on http(s):// only).
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (res.ok) {
        const json = await res.json();
        finish(json, 'data.json');
        return;
      }
    } catch (e) { /* file:// → fetch blocked; fall through */ }

    // Local snapshot from data.js (loaded via <script src>). Works on file://.
    if (typeof window.SEED_DATA !== 'undefined' && window.SEED_DATA.length) {
      finish(window.SEED_DATA, 'data.js snapshot', true);
      return;
    }

    // Last resort: any cached edits in localStorage.
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      try { finish(JSON.parse(cached), 'local cache', true); return; } catch (e) {}
    }

    // Nothing available.
    finish([], 'no data loaded', true);
    showEmpty('Could not load data.',
      'Serving over http is the most reliable option: run ' +
      '<b>python -m http.server</b> in this folder, then open ' +
      '<b>http://localhost:8000/tracker.html</b>.');
  }

  function reloadFromServer() {
    // Force a fresh read of data.json, ignoring the cache.
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('source-text').textContent = 'Loading data.json…';
    loadData();
  }

  // ── Helpers ────────────────────────────────────────────────
  function parseDate(s) {
    if (!s) return new Date(0);
    const [d, m, y] = String(s).split('/');
    if (!y) return new Date(0);
    return new Date(+y, +m - 1, +d);
  }

  function fmtDate(s) {
    const dt = parseDate(s);
    if (isNaN(dt) || dt.getTime() === 0) return s || '—';
    return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function statusBadge(s) {
    const map = {
      'applied':   'badge-applied',
      'interview': 'badge-interview',
      'offered':   'badge-offered',
      'rejected':  'badge-rejected',
      'withdrawn': 'badge-withdrawn',
    };
    const cls = map[(s || '').toLowerCase()] || 'badge-default';
    return `<span class="badge ${cls}"><span class="dot"></span>${escHtml(s) || '—'}</span>`;
  }

  function escHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Build dynamic filter dropdowns (clears first, no dupes) ─
  function buildFilters() {
    const pSel = document.getElementById('filter-platform');
    const lSel = document.getElementById('filter-level');
    const keepP = pSel.value, keepL = lSel.value;
    pSel.innerHTML = '<option value="">All</option>';
    lSel.innerHTML = '<option value="">All</option>';
    const platforms = [...new Set(data.map(r => r.platform).filter(Boolean))].sort();
    const levels    = [...new Set(data.map(r => r.level).filter(Boolean))].sort();
    platforms.forEach(p => pSel.add(new Option(p, p)));
    levels.forEach(l => lSel.add(new Option(l, l)));
    if (keepP) pSel.value = keepP;
    if (keepL) lSel.value = keepL;
  }

  // ── Stats ──────────────────────────────────────────────────
  function updateStats() {
    const now     = new Date();
    const wkAgo   = new Date(now - 7 * 864e5);
    const moStart = new Date(now.getFullYear(), now.getMonth(), 1);

    document.getElementById('stat-total').textContent       = data.length;
    document.getElementById('stat-this-week').textContent   = data.filter(r => parseDate(r.date) >= wkAgo).length;
    document.getElementById('stat-this-month').textContent  = data.filter(r => parseDate(r.date) >= moStart).length;
    document.getElementById('stat-interviews').textContent  = data.filter(r => (r.status || '').toLowerCase() === 'interview').length;
    document.getElementById('stat-offers').textContent      = data.filter(r => (r.status || '').toLowerCase() === 'offered').length;
    document.getElementById('total-count').textContent      = data.length;
  }

  // ── Sort ───────────────────────────────────────────────────
  function setSortIcons() {
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      const ic = th.querySelector('.th-icon');
      if (!ic) return;
      th.classList.toggle('active', th.dataset.col === sortCol);
      if (th.dataset.col === sortCol) {
        ic.className = 'fa-solid th-icon ' + (sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down');
      } else {
        ic.className = 'fa-solid fa-sort th-icon';
      }
    });
  }
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = 'asc'; }
      setSortIcons();
      render();
    });
  });

  // ── Render ─────────────────────────────────────────────────
  function render() {
    const q  = document.getElementById('search').value.toLowerCase();
    const st = document.getElementById('filter-status').value.toLowerCase();
    const pl = document.getElementById('filter-platform').value;
    const lv = document.getElementById('filter-level').value;

    let rows = data.filter(r => {
      const matchQ  = !q || [r.title, r.company, r.location, r.notes, r.platform, r.level].join(' ').toLowerCase().includes(q);
      const matchSt = !st || (r.status || '').toLowerCase() === st;
      const matchPl = !pl || r.platform === pl;
      const matchLv = !lv || r.level === lv;
      return matchQ && matchSt && matchPl && matchLv;
    });

    rows = rows.sort((a, b) => {
      let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
      if (sortCol === 'date') { va = parseDate(va); vb = parseDate(vb); }
      else if (sortCol === 'id') { va = +va; vb = +vb; }
      else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    document.getElementById('showing-count').textContent = rows.length;

    const tbody = document.getElementById('tbody');
    if (rows.length === 0) {
      tbody.innerHTML = '';
      showEmpty('No applications match your filters.',
        'Try clearing the search box or filters.');
      return;
    }
    hideEmpty();

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td class="id" data-label="#">${r.id}</td>
        <td class="date" data-label="Date">${fmtDate(r.date)}</td>
        <td class="title" data-label="Job Title">${escHtml(r.title)}</td>
        <td class="company" data-label="Company">${escHtml(r.company)}</td>
        <td class="location" data-label="Location">${escHtml(r.location)}</td>
        <td data-label="Platform"><span class="pill pill-platform">${escHtml(r.platform) || '—'}</span></td>
        <td data-label="Level"><span class="pill pill-level">${escHtml(r.level) || '—'}</span></td>
        <td class="salary" data-label="Salary">${escHtml(r.salary) || '—'}</td>
        <td data-label="Status">${statusBadge(r.status)}</td>
        <td class="notes" data-label="Notes">${escHtml(r.notes) || '—'}</td>
        <td data-label="">
          <div class="actions">
            <button class="icon-btn" title="Edit" onclick='editEntry(${r.id})'><i class="fa-solid fa-pen"></i></button>
            <button class="icon-btn del" title="Delete" onclick='confirmDelete(${r.id})'><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </td>
      </tr>`).join('');
  }

  function showEmpty(msg, hint) {
    const box = document.getElementById('empty');
    box.style.display = 'block';
    const p = box.querySelector('#empty-text');
    p.innerHTML = escHtml(msg);
    let hintEl = box.querySelector('.hint');
    if (hint) {
      if (!hintEl) {
        hintEl = document.createElement('p');
        hintEl.className = 'hint';
        p.after(hintEl);
      }
      hintEl.innerHTML = hint;
    } else if (hintEl) {
      hintEl.remove();
    }
  }
  function hideEmpty() { document.getElementById('empty').style.display = 'none'; }

  // ── Modal ──────────────────────────────────────────────────
  function openModal(prefill = {}) {
    editingId = prefill.id ?? null;
    document.getElementById('modal-title').textContent = editingId ? 'Edit Application' : 'Add Application';
    document.getElementById('btn-delete').style.display = editingId ? 'inline-flex' : 'none';

    let dateVal = '';
    if (prefill.date) {
      const [d, m, y] = prefill.date.split('/');
      dateVal = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
    } else {
      dateVal = new Date().toISOString().slice(0, 10);
    }

    document.getElementById('f-date').value     = dateVal;
    document.getElementById('f-title').value    = prefill.title    || '';
    document.getElementById('f-company').value  = prefill.company  || '';
    document.getElementById('f-location').value = prefill.location || '';
    document.getElementById('f-platform').value = prefill.platform || '';
    document.getElementById('f-level').value    = prefill.level    || '';
    document.getElementById('f-salary').value   = prefill.salary   || '';
    document.getElementById('f-status').value   = prefill.status   || 'Applied';
    document.getElementById('f-notes').value    = prefill.notes    || '';

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    editingId = null;
  }
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Save / Edit / Delete ───────────────────────────────────
  function saveEntry() {
    const rawDate = document.getElementById('f-date').value; // yyyy-mm-dd
    const [y, m, d] = rawDate.split('-');
    const date = (y && m && d) ? `${d}/${m}/${y}` : '';

    const entry = {
      id:       editingId ?? (Math.max(0, ...data.map(r => r.id)) + 1),
      date,
      title:    document.getElementById('f-title').value.trim(),
      company:  document.getElementById('f-company').value.trim(),
      location: document.getElementById('f-location').value.trim(),
      platform: document.getElementById('f-platform').value.trim(),
      level:    document.getElementById('f-level').value.trim(),
      salary:   document.getElementById('f-salary').value.trim(),
      status:   document.getElementById('f-status').value,
      notes:    document.getElementById('f-notes').value.trim(),
    };

    if (!entry.title || !entry.company) {
      alert('Job Title and Company are required.');
      return;
    }

    if (editingId !== null) {
      const idx = data.findIndex(r => r.id === editingId);
      if (idx !== -1) data[idx] = entry;
    } else {
      data.push(entry);
    }

    saveToStorage();
    buildFilters();
    updateStats();
    render();
    closeModal();
  }

  function editEntry(id) {
    const r = data.find(r => r.id === id);
    if (r) openModal(r);
  }

  function confirmDelete(id) {
    editingId = id;
    deleteEntry();
  }

  function deleteEntry() {
    if (editingId === null) return;
    if (!confirm('Delete this application?')) return;
    data = data.filter(r => r.id !== editingId);
    saveToStorage();
    buildFilters();
    updateStats();
    render();
    closeModal();
  }

  // ── Persistence ────────────────────────────────────────────
  // data.json stays the master record. We mirror edits into
  // localStorage so they survive a refresh when the file can't be
  // re-fetched (file://). Use "Export JSON" to write them back to
  // data.json permanently.
  function saveToStorage() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  // ── Export CSV ─────────────────────────────────────────────
  function exportCSV() {
    const headers = ['#', 'Date Applied', 'Job Title', 'Company', 'Location', 'Platform', 'Job Level', 'Salary', 'Status', 'Notes'];
    const rows = data.map(r =>
      [r.id, r.date, r.title, r.company, r.location, r.platform, r.level, r.salary, r.status, r.notes]
        .map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `job_applications_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Export JSON (save back to data.json) ───────────────────
  function exportJSON() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Boot ───────────────────────────────────────────────────
  setSortIcons();
  loadData();
</script>
</body>
</html>
